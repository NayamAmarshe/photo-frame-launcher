<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e12">
<title>Debug terminal</title>
<style>
  :root {
    --bg: #0d0e12; --panel: #16181d; --card: #22252d; --card2: #2c3039;
    --text: #f5f5f6; --dim: #9ba1ad; --accent: #ffb454; --accent-ink: #2a1a00;
    --ok: #5fd38d; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 900px; margin: 0 auto; }

  header { flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px; padding-top: calc(14px + env(safe-area-inset-top)); }
  .brand { display: flex; align-items: center; font-size: 18px; font-weight: 650; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); margin-right: 10px; position: relative; }
  .logo::after { content: ">_"; position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex;
    align-items: center; justify-content: center; font: 700 12px ui-monospace, Menlo, monospace; color: var(--accent-ink); }
  .status { font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 14px; background: var(--card); color: var(--dim); }
  .status.on { color: var(--ok); }
  .status.off { color: var(--bad); }

  .chips { flex: none; display: flex; overflow-x: auto; padding: 4px 16px 10px; -webkit-overflow-scrolling: touch; }
  .chips button { flex: none; border: 0; background: var(--card); color: var(--text); border-radius: 18px;
    padding: 0 16px; height: 38px; font-size: 15px; font-weight: 600; margin-right: 8px; }
  .chips button:active { background: var(--card2); }

  #screen { flex: 1; min-height: 0; margin: 0 12px; background: #08090c; border-radius: 18px; padding: 14px 14px;
    overflow-y: auto; -webkit-overflow-scrolling: touch; border: 1px solid #1c1f26;
    font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
    user-select: text; -webkit-user-select: text; }
  #screen .cmd { color: var(--accent); }
  #screen .sys { color: var(--dim); }
  #screen .err { color: var(--bad); }

  .bar { flex: none; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); }
  .tools { display: flex; margin-bottom: 8px; }
  .tools button { border: 0; background: transparent; color: var(--dim); font-size: 14px; font-weight: 600;
    padding: 6px 12px; border-radius: 12px; }
  .tools button:active { background: var(--card); }
  .tools .grow { flex: 1; }
  .row { display: flex; align-items: center; background: var(--panel); border-radius: 18px; padding: 6px 6px 6px 16px; }
  .prompt { color: var(--accent); font: 700 17px ui-monospace, Menlo, monospace; margin-right: 10px; }
  #line { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text);
    font: 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; height: 44px; }
  #run { border: 0; background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 700;
    height: 44px; padding: 0 20px; border-radius: 14px; }

  .note { flex: none; text-align: center; font-size: 12px; color: var(--dim); padding: 0 16px 6px; }
  .note b { color: var(--text); font-weight: 600; }
  /* no focus rings or tap flashes anywhere */
  *, *:focus, *:focus-visible, *:active { outline: none !important; -webkit-tap-highlight-color: transparent !important; }
  button:focus, a:focus, input:focus, select:focus, textarea:focus, [tabindex]:focus { outline: none !important; box-shadow: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="logo"></span>Debug terminal</div>
    <div class="status" id="status">Connecting&hellip;</div>
  </header>

  <div class="chips" id="chips"></div>
  <div id="screen"></div>

  <div class="bar">
    <div class="tools">
      <button id="hUp">&#8593; Earlier</button>
      <button id="hDown">&#8595; Later</button>
      <span class="grow"></span>
      <button id="clear">Clear</button>
      <button id="restart">Restart shell</button>
    </div>
    <div class="row">
      <span class="prompt">$</span>
      <input id="line" type="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false"
             enterkeyhint="send" placeholder="Type a command">
      <button id="run">Run</button>
    </div>
  </div>
  <div class="note">Runs as the Photo Frame app. <b>Made by Nayam Amarshe</b> &#10084;&#65039;</div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var screen = $('screen'), line = $('line'), statusEl = $('status');
  var sid = null, since = 0, history = [], hpos = 0, polling = null, busy = false;

  var QUICK = [
    ['Android version', 'getprop ro.build.version.release; getprop ro.product.model'],
    ['Storage', 'df'],
    ['Memory', 'head -5 /proc/meminfo'],
    ['Wi-Fi', 'ip addr show wlan0'],
    ['Apps', 'pm list packages -3'],
    ['Processes', 'ps'],
    ['Logs', 'logcat -d -t 60'],
    ['Time', 'date']
  ];

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status ' + (cls || ''); }

  function add(text, cls) {
    var stick = screen.scrollTop + screen.clientHeight >= screen.scrollHeight - 40;
    var span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text;
    screen.appendChild(span);
    while (screen.childNodes.length > 800) screen.removeChild(screen.firstChild);
    if (stick) screen.scrollTop = screen.scrollHeight;
  }

  function api(method, url, body, cb) {
    var x = new XMLHttpRequest();
    x.open(method, url);
    x.onload = function () { var j = null; try { j = JSON.parse(x.responseText); } catch (e) {} cb(x.status, j); };
    x.onerror = function () { cb(0, null); };
    x.send(body === null ? null : body);
  }

  function openShell() {
    clearInterval(polling);
    sid = null; since = 0;
    setStatus('Connecting…');
    api('POST', '/api/debug/open', '', function (code, j) {
      if (code === 200 && j && j.id) {
        sid = j.id;
        setStatus('Connected', 'on');
        add('Shell ready. Try a button above.\n', 'sys');
        polling = setInterval(poll, 400);
      } else {
        setStatus('Offline', 'off');
        add('Could not reach the frame. Is the photo frame on and on the same Wi-Fi?\n', 'err');
      }
    });
  }

  function poll() {
    if (!sid || busy) return;
    busy = true;
    api('GET', '/api/debug/output?id=' + sid + '&since=' + since, null, function (code, j) {
      busy = false;
      if (code === 200 && j) {
        if (j.text) add(j.text);
        since = j.next;
        if (!j.alive) { add('\n[shell ended]\n', 'sys'); setStatus('Ended', 'off'); clearInterval(polling); }
      } else if (code === 404) {
        setStatus('Ended', 'off'); clearInterval(polling);
      } else if (code === 0) {
        setStatus('Offline', 'off');
      }
    });
  }

  function run(cmd) {
    if (!sid) { add('No shell yet. Tap "Restart shell".\n', 'err'); return; }
    add('$ ' + cmd + '\n', 'cmd');
    if (cmd.trim() && history[history.length - 1] !== cmd) history.push(cmd);
    hpos = history.length;
    api('POST', '/api/debug/input?id=' + sid, cmd, function (code) {
      if (code !== 200) { add('[could not send, shell may have ended]\n', 'err'); setStatus('Ended', 'off'); }
      else poll();
    });
  }

  function submit() {
    var cmd = line.value;
    line.value = '';
    run(cmd);
    line.focus();
  }

  $('run').addEventListener('click', submit);
  line.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); $('hUp').click(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); $('hDown').click(); }
  });
  $('hUp').addEventListener('click', function () {
    if (hpos > 0) hpos--;
    line.value = history[hpos] || '';
  });
  $('hDown').addEventListener('click', function () {
    if (hpos < history.length) hpos++;
    line.value = history[hpos] || '';
  });
  $('clear').addEventListener('click', function () { screen.innerHTML = ''; });
  $('restart').addEventListener('click', function () {
    var old = sid;
    clearInterval(polling);
    if (old) api('POST', '/api/debug/kill?id=' + old, '', function () {});
    add('\n[restarting shell]\n', 'sys');
    openShell();
  });

  QUICK.forEach(function (q) {
    var b = document.createElement('button');
    b.textContent = q[0];
    b.addEventListener('click', function () { run(q[1]); });
    $('chips').appendChild(b);
  });

  add('Photo Frame debug terminal\n', 'sys');
  add('Commands run on the photo frame as the app. No keyboard shortcuts like Ctrl+C: use "Restart shell" to stop a stuck command.\n\n', 'sys');
  openShell();
})();
</script>
</body>
</html>
