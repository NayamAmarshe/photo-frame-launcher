<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Frame Music</title>
<link rel="stylesheet" href="/static/ui.css">
<style>
  :root { --bg: #14161b; --glass: rgba(255,255,255,.08); --glass2: rgba(255,255,255,.16); --text: #fff; --dim: rgba(255,255,255,.62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); min-height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 18px 16px 150px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .top h1 { margin: 0; font-size: 30px; font-weight: 300; }
  .top a { color: var(--text); text-decoration: none; background: var(--glass); padding: 10px 18px; border-radius: 999px; font-size: 16px; font-weight: 600; }
  form { display: flex; }
  input[type=search] { flex: 1; min-width: 0; height: 54px; border: 0; border-radius: 999px; background: var(--glass); color: var(--text);
    font-size: 18px; padding: 0 22px; outline: none; }
  input::placeholder { color: var(--dim); }
  form button { margin-left: 10px; height: 54px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--glass2); color: var(--text); font-size: 18px; font-weight: 600; }
  h2 { font-size: 14px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dim); font-weight: 600; margin: 26px 4px 10px; }
  .row { display: flex; align-items: center; background: var(--glass); border-radius: 18px; padding: 8px; margin-bottom: 8px; }
  .row.now { background: var(--glass2); }
  .row img { width: 96px; height: 54px; object-fit: cover; border-radius: 10px; background: #000; flex: none; }
  .row .t { flex: 1; min-width: 0; padding: 0 12px; }
  .row .t b { display: block; font-size: 16px; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .t span { display: block; font-size: 13px; color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib { flex: none; width: 46px; height: 46px; border: 0; border-radius: 23px; background: var(--glass2); color: var(--text); margin-left: 6px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .ib svg { width: 22px; height: 22px; fill: #fff; }
  .msg { text-align: center; color: var(--dim); padding: 30px 10px; font-size: 17px; }
  .note { background: var(--glass); border-radius: 14px; padding: 12px 14px; font-size: 15px; color: var(--dim); margin: 14px 0 0; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); display: none; }
  #bar .in { max-width: 640px; margin: 0 auto; background: #2a2d35; border-radius: 26px; padding: 10px; }
  #bar .l1 { display: flex; align-items: center; }
  #bar img { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; background: #000; flex: none; }
  #bar .t { flex: 1; min-width: 0; padding: 0 12px; }
  #bar .t b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .t span { font-size: 13px; color: var(--dim); }
  #bar .prog { height: 4px; background: rgba(255,255,255,.18); border-radius: 2px; margin: 10px 4px 2px; overflow: hidden; }
  #bar .prog i { display: block; height: 100%; width: 0; background: #fff; }
  #bar .vol { display: flex; align-items: center; margin: 8px 6px 2px; }
  #bar .vol svg { width: 22px; height: 22px; fill: var(--dim); flex: none; }
  #bar .vol input { flex: 1; margin: 0 0 0 12px; height: 30px; accent-color: #fff; }
  #bar .boost { flex: none; margin-left: 12px; height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--glass2); color: #fff; font-size: 14px; font-weight: 600; }
  #bar .boost.on { background: #fff; color: #14161b; }
  #bar .ib.big { width: 54px; height: 54px; border-radius: 27px; background: #fff; }
  #bar .ib.big svg { fill: #14161b; width: 26px; height: 26px; }
  /* no focus rings or tap flashes anywhere */
  *, *:focus, *:focus-visible, *:active { outline: none !important; -webkit-tap-highlight-color: transparent !important; }
  button:focus, a:focus, input:focus, select:focus, textarea:focus, [tabindex]:focus { outline: none !important; box-shadow: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Music</h1><a class="homebtn" href="/dashboard" id="toPhotos">Home</a></div>
  <form id="f"><input id="q" type="search" placeholder="Search YouTube" enterkeyhint="search" autocomplete="off"><button>Search</button></form>
  <div class="note">Plays on the frame's speaker. Tap a song to play it now, or tap + to add it to the list.</div>
  <div id="queueBox"></div>
  <div id="results"></div>
  <div id="historyBox"></div>
</div>

<div id="bar"><div class="in">
  <div class="l1">
    <img id="bImg" alt="">
    <div class="t"><b id="bTitle"></b><span id="bSub"></span></div>
    <button class="ib" id="bPrev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
    <button class="ib big" id="bPlay" aria-label="Play or pause"></button>
    <button class="ib" id="bNext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
  </div>
  <div class="prog"><i id="bProg"></i></div>
  <div class="vol"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input id="bVol" type="range" min="0" max="100" step="5" value="70" aria-label="Volume"><button id="bBoost" class="boost">Louder</button></div>
</div></div>

<script>
if (window.top !== window) document.getElementById('toPhotos').style.display = 'none';
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
  var PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  var ADD = '<svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>';
  var CLOSE = '<svg viewBox="0 0 24 24"><path d="M6.4 5l12.6 12.6-1.4 1.4L5 6.4zM19 6.4 6.4 19 5 17.6 17.6 5z"/></svg>';
  var results = [];
  var hist = [];
  var last = null;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function post(url, body) {
    return fetch(url, { method: 'POST', body: body ? JSON.stringify(body) : '' }).then(function (r) { return r.json(); });
  }
  function cmd(c, extra) { post('/api/music/cmd?c=' + c + (extra || '')).then(render); }

  function rowHtml(t, i, kind) {
    var btns = kind === 'result'
      ? '<button class="ib" data-add="' + i + '" aria-label="Add to list">' + ADD + '</button>'
      : '<button class="ib" data-rm="' + i + '" aria-label="Remove">' + CLOSE + '</button>';
    return '<div class="row' + (kind === 'queue' && last && last.index === i ? ' now' : '') + '" data-' + (kind === 'result' ? 'play' : 'jump') + '="' + i + '">' +
      '<img src="' + esc(t.thumb) + '" alt=""><div class="t"><b>' + esc(t.title) + '</b><span>' + esc(t.channel) + ' &middot; ' + esc(t.length) + '</span></div>' + btns + '</div>';
  }

  function search(q) {
    $('results').innerHTML = '<div class="msg">Searching&hellip;</div>';
    fetch('/api/music/search?q=' + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (d) {
      if (d.error) { $('results').innerHTML = '<div class="msg">' + esc(d.error) + '</div>'; return; }
      results = d.results || [];
      if (!results.length) { $('results').innerHTML = '<div class="msg">Nothing found. Try other words.</div>'; return; }
      $('results').innerHTML = '<h2>Results</h2>' + results.map(function (t, i) { return rowHtml(t, i, 'result'); }).join('');
    }).catch(function () { $('results').innerHTML = '<div class="msg">Could not search. Is the phone on the same Wi-Fi?</div>'; });
  }

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = $('q').value.trim();
    if (q) { $('q').blur(); search(q); }
  });

  $('results').addEventListener('click', function (e) {
    var add = e.target.closest('[data-add]');
    var row = e.target.closest('[data-play]');
    var i = add ? +add.getAttribute('data-add') : row ? +row.getAttribute('data-play') : -1;
    if (i < 0 || !results[i]) return;
    post('/api/music/play', Object.assign({ mode: add ? 'queue' : 'now' }, results[i])).then(function (s) { render(s); loadHistory(); });
  });
  $('historyBox').addEventListener('click', function (e) {
    if (e.target.closest('#clearHist')) {
      post('/api/music/history-clear').then(function () { hist = []; drawHistory(); });
      return;
    }
    var add = e.target.closest('[data-hadd]');
    var row = e.target.closest('[data-hplay]');
    var i = add ? +add.getAttribute('data-hadd') : row ? +row.getAttribute('data-hplay') : -1;
    if (i < 0 || !hist[i]) return;
    post('/api/music/play', Object.assign({ mode: add ? 'queue' : 'now' }, hist[i])).then(function (s) { render(s); loadHistory(); });
  });
  function drawHistory() {
    if (!hist.length) { $('historyBox').innerHTML = ''; return; }
    $('historyBox').innerHTML = '<h2>Recently played <a id="clearHist" href="#" onclick="return false" style="float:right;color:var(--dim);text-transform:none;letter-spacing:0;font-size:14px">Clear</a></h2>' +
      hist.map(function (t, i) {
        return '<div class="row" data-hplay="' + i + '"><img src="' + esc(t.thumb) + '" alt=""><div class="t"><b>' + esc(t.title) + '</b><span>' + esc(t.channel) + ' &middot; ' + esc(t.length) + '</span></div>' +
          '<button class="ib" data-hadd="' + i + '" aria-label="Add to list">' + ADD + '</button></div>';
      }).join('');
  }
  function loadHistory() {
    fetch('/api/music/history').then(function (r) { return r.json(); }).then(function (d) { hist = d.results || []; drawHistory(); }).catch(function () {});
  }
  loadHistory();
  $('queueBox').addEventListener('click', function (e) {
    var rm = e.target.closest('[data-rm]');
    if (rm) { e.stopPropagation(); cmd('remove', '&i=' + rm.getAttribute('data-rm')); }
  });

  var volDrag = false, volSent = 0;
  $('bVol').addEventListener('input', function () {
    volDrag = true;
    var now = Date.now(); if (now - volSent < 150) return; volSent = now;
    fetch('/api/music/volume?v=' + this.value, { method: 'POST' });
  });
  $('bVol').addEventListener('change', function () {
    fetch('/api/music/volume?v=' + this.value, { method: 'POST' }).then(function () { volDrag = false; });
  });
  $('bBoost').addEventListener('click', function () { var on = !this.classList.contains('on'); this.classList.toggle('on', on); fetch('/api/music/boost?on=' + (on ? 1 : 0), { method: 'POST' }); });
  $('bPlay').addEventListener('click', function () { cmd('toggle'); });
  $('bNext').addEventListener('click', function () { cmd('next'); });
  $('bPrev').addEventListener('click', function () { cmd('prev'); });

  function mmss(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }

  function render(s) {
    if (!s || s.queue === undefined) return;
    last = s;
    var t = s.track;
    $('bar').style.display = t ? 'block' : 'none';
    if (t) {
      $('bImg').src = t.thumb;
      $('bTitle').textContent = t.title;
      $('bSub').textContent = s.message ? s.message : s.loading ? 'Loading…' : (s.playing ? '' : 'Paused · ') + mmss(s.pos) + ' / ' + mmss(s.dur);
      $('bPlay').innerHTML = s.playing ? PAUSE : PLAY;
      if (!volDrag && s.volume !== undefined) $('bVol').value = s.volume;
      $('bBoost').classList.toggle('on', !!s.boost);
      $('bProg').style.width = (s.dur > 0 ? Math.min(100, s.pos / s.dur * 100) : 0) + '%';
    }
    var upnext = s.queue.length > 1 || (s.queue.length === 1 && false);
    $('queueBox').innerHTML = s.queue.length
      ? '<h2>Your list</h2>' + s.queue.map(function (x, i) { return rowHtml(x, i, 'queue'); }).join('') : '';
  }

  function poll() {
    fetch('/api/music/state').then(function (r) { return r.json(); }).then(render).catch(function () {});
  }
  poll(); setInterval(poll, 1500);
})();
</script>
</body>
</html>
