<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>Photo Frame</title>
<link rel="stylesheet" href="/static/ui.css">
<style>
  .hello { padding: 26px 4px 8px; }
  .hello h1 { margin: 0 0 8px; font-size: 38px; font-weight: 300; letter-spacing: .2px; }
  .hello p { margin: 0; font-size: 19px; color: var(--dim); }
  .tiles { margin-top: 26px; }
  a.tile { display: flex; align-items: center; text-decoration: none; color: var(--text); background: var(--glass);
    border-radius: 28px; padding: 24px 22px; margin-bottom: 14px; }
  a.tile:active { background: var(--glass2); }
  a.tile .ic { flex: none; width: 64px; height: 64px; border-radius: 32px; background: var(--glass2); display: flex;
    align-items: center; justify-content: center; margin-right: 18px; }
  a.tile .ic svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  a.tile .tx { flex: 1; min-width: 0; }
  a.tile b { display: block; font-size: 23px; font-weight: 600; margin-bottom: 4px; }
  a.tile span { display: block; font-size: 16px; color: var(--dim); line-height: 1.35; }
  a.tile .go { flex: none; width: 26px; height: 26px; fill: none; stroke: var(--dim); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #now { display: none; margin-top: 8px; padding: 14px 18px; border-radius: 999px; background: var(--glass); font-size: 16px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #now b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hello"><h1>Photo Frame</h1><p>What would you like to do?</p></div>
  <div class="tiles">
    <a class="tile" href="/send">
      <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg></div>
      <div class="tx"><b>Send photos</b><span>Add pictures from your phone, or tidy up the ones on the frame.</span></div>
      <svg class="go" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </a>
    <a class="tile" href="/music">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
      <div class="tx"><b>Music</b><span>Search a song and play it on the frame&rsquo;s speaker.</span></div>
      <svg class="go" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </a>
  </div>
  <div id="now"></div>
  <div class="foot"><b>Made by Nayam Amarshe</b> &#10084;&#65039;</div>
</div>
<script>
  // a small line that shows what is playing right now
  fetch('/api/music/state').then(function (r) { return r.json(); }).then(function (s) {
    if (s && s.track && (s.playing || s.loading)) {
      var n = document.getElementById('now');
      n.innerHTML = 'Now playing: <b></b>';
      n.querySelector('b').textContent = s.track.title;
      n.style.display = 'block';
    }
  }).catch(function () {});
</script>
</body>
</html>
